# 表对比工具 - 阿里云 ECS 容器化部署
# 用法:
#   1) 在 .env 中设置 TABLE_DIFF_TOKEN(必填,生成: openssl rand -hex 16)
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<ECS公网IP>:8000(建议再接 Nginx + HTTPS,见 docs/05)
services:
  table-diff:
    build: .
    image: table-diff:latest
    container_name: table-diff
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TABLE_DIFF_HOST: "0.0.0.0"
      TABLE_DIFF_PORT: "8000"
      TABLE_DIFF_DATA_DIR: "/app/data"
      # 访问口令(所有人共用):未设置时 docker compose 会拒绝启动,防止裸奔
      TABLE_DIFF_TOKEN: "${TABLE_DIFF_TOKEN:?请在 .env 中设置 TABLE_DIFF_TOKEN,生成命令: openssl rand -hex 16}"
    volumes:
      # 数据(方案/对账记录/上传文件)持久化到宿主机 ./data,定期备份即可
      - ./data:/app/data
